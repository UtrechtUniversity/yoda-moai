name: Lint and run tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install flake dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8==6.0.0 flake8-import-order

      - name: Lint with flake8
        run: |
          flake8 --statistics moai

      - name: Install test dependencies
        run: |
          sudo apt -u update
          sudo apt -y install apache2-dev libsqlite3-dev
          python -m pip install mypy==1.16.1
          python -m pip install types-requests
          python -m pip install wheel
          python -m pip install -r requirements.txt
          python -m pip install ./

      - name: Run type checks
        run: |
          mypy --ignore-missing-imports moai

      - name: Run unit and integration tests
        run: |
          cd moai
          python -m unittest
