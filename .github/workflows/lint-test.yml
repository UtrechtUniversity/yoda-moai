name: Lint and run tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install flake dependencies
        run: |
          python -m pip install --upgrade pip==26.0.1
          python -m pip install flake8==7.3.0 flake8-import-order flake8-pyproject==1.2.4

      - name: Lint with flake8
        run: |
          flake8 --statistics moai

      - name: Install test dependencies
        run: |
          sudo apt -u update
          sudo apt -y install apache2-dev libsqlite3-dev
          python -m pip install -U pip==26.0.1
          python -m pip install mypy==1.16.1
          python -m pip install types-requests==2.32.4.20260107
          python -m pip install wheel==0.46.3
          python -m pip install ./

      - name: Run type checks
        run: |
          mypy --ignore-missing-imports moai

      - name: Run unit and integration tests
        run: |
          python -m unittest moai.tests.testsuite
